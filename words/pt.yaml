# The words of the weather in Portuguese (Brazil), as the dashboard shows them (D-502): its title and line in Packages, and what its widgets write; from words/it.yaml.
title: o clima pela pontuação climática, de Stefano Caronia
about: o céu muda a cada amanhecer com uma rolagem, com as estações, os desertos quentes, o frio polar e a neblina
